[package]
name = "rust-skills"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive"] }
evdev = "0.13.1"
indicatif = "0.18.4"
log = "0.4.27"
nix = { version = "0.29.0", features = ["user", "process"]}
ringbuffer = "0.15.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
simple_logger = "5.0.0"
smallvec = "1.15.0"

[dev-dependencies]
jsonschema = "0.30.0"
serde_json = "1.0.140"
